{% extends "base.html" %}
{% block title %}{{ mode }} Customer{% endblock %}
{% block content %}
<h3 class="mb-3">{{ mode }} Customer</h3>
<div class="card p-4"><form method="post" class="row g-3">
  <div class="col-md-6"><label class="form-label">Name *</label>
    <input class="form-control" name="customer_name" value="{{ customer.customer_name or '' }}" required></div>
  <div class="col-md-6"><label class="form-label">Email * (unique)</label>
    <input class="form-control" type="email" name="email" value="{{ customer.email or '' }}" required></div>
  <div class="col-md-6"><label class="form-label">Phone</label>
    <input class="form-control" name="phone" value="{{ customer.phone or '' }}"></div>
  <div class="col-md-6"><label class="form-label">Address</label>
    <input class="form-control" name="address" value="{{ customer.address or '' }}"></div>
  <div class="col-12"><button class="btn btn-primary">Save</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('customers') }}">Cancel</a></div>
</form></div>
{% endblock %}
