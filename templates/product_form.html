{% extends "base.html" %}
{% block title %}{{ mode }} Product{% endblock %}
{% block content %}
<h3 class="mb-3">{{ mode }} Product</h3>
<div class="card p-4"><form method="post" class="row g-3">
  <div class="col-md-6"><label class="form-label">Product Name *</label>
    <input class="form-control" name="product_name" value="{{ product.product_name or '' }}" required></div>
  <div class="col-md-6"><label class="form-label">SKU * (unique)</label>
    <input class="form-control" name="sku" value="{{ product.sku or '' }}" required></div>
  <div class="col-md-6"><label class="form-label">Category *</label>
    <select class="form-select" name="category_id" required>
      <option value="">-- choose --</option>
      {% for c in categories %}<option value="{{ c.category_id }}" {{ 'selected' if product.category_id|string == c.category_id|string }}>{{ c.category_name }}</option>{% endfor %}
    </select></div>
  <div class="col-md-3"><label class="form-label">Price (₹) *</label>
    <input class="form-control" type="number" step="0.01" min="0" name="price" value="{{ product.price if product.price is not none else '' }}" required></div>
  <div class="col-md-3"><label class="form-label">Stock *</label>
    <input class="form-control" type="number" min="0" name="stock_quantity" value="{{ product.stock_quantity if product.stock_quantity is not none else '' }}" required></div>
  <div class="col-12"><label class="form-label">Description</label>
    <textarea class="form-control" name="description" rows="2">{{ product.description or '' }}</textarea></div>
  <div class="col-12"><button class="btn btn-primary">Save</button>
    <a class="btn btn-outline-secondary" href="{{ url_for('products') }}">Cancel</a></div>
</form></div>
{% endblock %}
